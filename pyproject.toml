[project]
name = "sy-os"
version = "0.1.0"
description = "SY OS — production system for a knitwear export factory"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = ["core/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "E731", "B905"]  # short helper lambdas read fine
